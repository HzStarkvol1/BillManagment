spring.application.name=BillManagment

# SQLite Veritabani Baglantisi (Proje kök dizininde billmanagment.db adinda dosya olusturur)
spring.datasource.url=jdbc:sqlite:billmanagment.db
spring.datasource.driverClassName=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# SQLite icin JPA/Hibernate ayarlari (Spring Boot 3 / Hibernate 6 icin guncel yol eklendi)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console kapali cunku SQLite kullaniyoruz
spring.h2.console.enabled=false
