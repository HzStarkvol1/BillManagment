<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212; 
            color: #e0e0e0; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            position: relative; 
            background-color: #1e1e1e; 
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
        }

        .toggle-wrapper {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .toggle-text {
            color: #777777;
            transition: color 0.3s;
        }

        .toggle-text.active {
            color: #ffffff;
            font-weight: bold;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555555;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #a0a0a0;
        }

        input:focus + .slider {
            box-shadow: 0 0 1px #a0a0a0;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b0b0b0; 
        }

        .form-control {
            width: 100%;
            padding: 14px;
            background-color: #2c2c2c; 
            border: 1px solid #444444; 
            border-radius: 5px;
            color: #ffffff;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #a0a0a0; 
            background-color: #333333;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #3a3a3a; 
            color: #ffffff;
            border: 1px solid #555555;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #5a5a5a; 
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .forgot-password {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888888;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="toggle-wrapper">
            <span class="toggle-text active" id="textUser">User</span>
            <label class="switch">
                <input type="checkbox" id="loginToggle">
                <span class="slider"></span>
            </label>
            <span class="toggle-text" id="textAdmin">Admin</span>
        </div>

        <div class="login-header">
            <h2 id="headerTitle">Sign In</h2>
        </div>

        <div id="userLoginForm">
            <form action="/login" method="post" th:object="${user}">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control">
                </div>

                <button type="submit" class="login-btn">Log In</button>

            </form>
        </div>

        <div id="adminLoginForm" style="display: none;">
            <form action="/adminlogin" method="post" th:object="${admin}">

                <div class="form-group">
                    <label for="adminUsername">Admin Username</label>
                    <input type="text" id="adminUsername" th:field="*{username}" class="form-control">
                </div>

                <div class="form-group">
                    <label for="adminPassword">Admin Password</label>
                    <input type="password" id="adminPassword" th:field="*{password}" class="form-control">
                </div>

                <button type="submit" class="login-btn">Admin Log In</button>

            </form>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('loginToggle');
        const userForm = document.getElementById('userLoginForm');
        const adminForm = document.getElementById('adminLoginForm');
        const headerTitle = document.getElementById('headerTitle');
        const textUser = document.getElementById('textUser');
        const textAdmin = document.getElementById('textAdmin');

        toggle.addEventListener('change', function() {
            if (this.checked) {
                userForm.style.display = 'none';
                adminForm.style.display = 'block';
                headerTitle.innerText = 'Admin Sign In';
                
                textUser.classList.remove('active');
                textAdmin.classList.add('active');
            } else {
                adminForm.style.display = 'none';
                userForm.style.display = 'block';
                headerTitle.innerText = 'Sign In';
                
                textAdmin.classList.remove('active');
                textUser.classList.add('active');
            }
        });
    </script>
</body>
</html>
