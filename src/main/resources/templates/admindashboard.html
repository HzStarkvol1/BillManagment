<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h2 {
            color: #ffffff;
        }

        .logout-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .logout-btn:hover {
            background-color: #b71c1c;
        }

        .dashboard-content {
            display: flex;
            gap: 40px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            flex: 1;
        }

        h3 {
            margin-bottom: 20px;
            color: #ffffff;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b0b0b0;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 5px;
            color: #ffffff;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #a0a0a0;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #388e3c;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #2e7d32;
        }

        .list-card {
            flex: 1.5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }

        th {
            color: #aaaaaa;
            font-weight: normal;
        }

        .delete-btn {
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .delete-btn:hover {
            background-color: #d50000;
        }

        /* CUSTOM MODAL CSS */
        .modal-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background-color: #1e1e1e;
            padding: 25px; border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            text-align: center; width: 320px;
            border: 1px solid #333;
        }
        .modal-box p { color: #e0e0e0; margin-bottom: 25px; font-size: 16px; }
        .modal-buttons { display: flex; justify-content: space-between; gap: 15px; }
        .btn-modal-yes, .btn-modal-no {
            flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; transition: background-color 0.3s;
        }
        .btn-modal-yes { background-color: #d32f2f; }
        .btn-modal-yes:hover { background-color: #b71c1c; }
        .btn-modal-no { background-color: #555555; }
        .btn-modal-no:hover { background-color: #777777; }
        
    </style>
</head>
<body>

    <div class="dashboard-header">
        <h2>Admin Dashboard</h2>
        <button class="logout-btn" onclick="confirmLogout()">Log Out</button>
    </div>

    <div class="dashboard-content">
        
        <div class="card">
            <h3>Add New User</h3>
            <form action="/admin/dashboard/add-user" method="post" th:object="${newUser}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required>
                </div>
                <button type="button" class="submit-btn" onclick="confirmFormSubmit(event, 'Are you sure you want to add this user?')">+ Add User</button>
            </form>
        </div>

        <div class="card list-card">
            <h3>Registered Users</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${usersList}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.username}">SampleUser</td>
                        <td>
                            <form th:action="@{/admin/dashboard/delete-user/{id}(id=${user.id})}" method="post">
                                <button type="button" class="delete-btn" onclick="confirmFormSubmit(event, 'Are you sure you want to delete this user?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- CUSTOM MODAL HTML -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <p id="modalMessage">Are you sure?</p>
            <div class="modal-buttons">
                <button class="btn-modal-yes" id="modalBtnYes">Yes</button>
                <button class="btn-modal-no" id="modalBtnNo">No</button>
            </div>
        </div>
    </div>

    <script>
        let modalConfirmAction = null;

        function showCustomModal(message, actionCallback) {
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').style.display = 'flex';
            modalConfirmAction = actionCallback;
        }

        document.getElementById('modalBtnNo').addEventListener('click', function() {
            document.getElementById('customModal').style.display = 'none';
            modalConfirmAction = null;
        });

        document.getElementById('modalBtnYes').addEventListener('click', function() {
            document.getElementById('customModal').style.display = 'none';
            if (modalConfirmAction) {
                modalConfirmAction();
            }
        });

        function confirmLogout() {
            showCustomModal("Are you sure you want to log out?", function() {
                window.location.href = "/";
            });
        }

        function confirmFormSubmit(event, message) {
            event.preventDefault();
            const form = event.target.closest('form');
            showCustomModal(message, function() {
                form.submit();
            });
        }
    </script>
</body>
</html>
